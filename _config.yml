# Site settings. Restart `jekyll serve` after editing this file.
title: Knight Codes
description: Chris Knight's developer blog
author:
  name: Chris Knight
url: "https://knightcodes.com"
baseurl: ""
github_username: cknightdevelopment
timezone: America/Chicago

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
