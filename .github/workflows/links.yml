# Weekly check of external links. Kept out of the deploy so a flaky third-party
# site can't block publishing; GitHub emails on failure.
name: Check external links

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 403/429/999: sites that block bots or rate-limit, not broken links.
      - run: bundle exec htmlproofer _site --ignore-status-codes "403,429,999"
